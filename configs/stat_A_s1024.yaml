log_dir: /root/autodl-tmp/DeepfakeBench/logs/ucf
pretrained: ./training/pretrained/xception-b5690688.pth
model_name: ucf
backbone_name: xception
encoder_feat_dim: 512
backbone_config:
  mode: adjust_channel
  num_classes: 2
  inc: 3
  dropout: false
all_dataset:
- FaceForensics++
- FF-F2F
- FF-DF
- FF-FS
- FF-NT
- FaceShifter
- DeepFakeDetection
- Celeb-DF-v1
- Celeb-DF-v2
- DFDCP
- DFDC
- DeeperForensics-1.0
- UADFV
train_dataset:
- FF-F2F
- FF-DF
- FF-FS
- FF-NT
test_dataset:
- Celeb-DF-v2
dataset_type: pair
compression: c23
train_batchSize: 16
test_batchSize: 32
workers: 8
frame_num:
  train: 32
  test: 32
resolution: 256
with_mask: false
with_landmark: false
save_feat: true
label_dict:
  DFD_fake: 1
  DFD_real: 0
  FaceShifter: 1
  FF-FH: 1
  FF-DF: 1
  FF-F2F: 2
  FF-FS: 3
  FF-NT: 4
  FF-real: 0
  CelebDFv1_real: 0
  CelebDFv1_fake: 1
  CelebDFv2_real: 0
  CelebDFv2_fake: 1
  DFDCP_Real: 0
  DFDCP_FakeA: 1
  DFDCP_FakeB: 1
  DFDC_Fake: 1
  DFDC_Real: 0
  DF_fake: 1
  DF_real: 0
  UADFV_Fake: 1
  UADFV_Real: 0
  roop_Fake: 1
  roop_Real: 0
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit:
  - -10
  - 10
  blur_prob: 0.5
  blur_limit:
  - 3
  - 7
  brightness_prob: 0.5
  brightness_limit:
  - -0.1
  - 0.1
  contrast_limit:
  - -0.1
  - 0.1
  quality_lower: 40
  quality_upper: 100
mean:
- 0.5
- 0.5
- 0.5
std:
- 0.5
- 0.5
- 0.5
optimizer:
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
lr_scheduler: cosine
nEpochs: 3
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024
save_ckpt: false
loss_func:
  cls_loss: cross_entropy
  spe_loss: cross_entropy
  con_loss: contrastive_regularization
  rec_loss: l1loss
  cons2_loss: cross_method_consistency
# ===== Cross-Method Consistency (our innovation) =====
cross_method_consistency: false
consistency_weight: 0.1
consistency_temperature: 0.1
losstype: null
metric_scoring: auc
cuda: true
cudnn: false
lr_T_max: 3
lr_eta_min: 1.0e-06
SWA: false
swa_start: 2
task_target: stat_A_s1024
